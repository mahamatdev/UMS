<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ISCAM — Institut Supérieur de Comptabilité et d'Administration de Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0f2346;
      --navy-mid: #1a3a6b;
      --navy-light: #24518f;
      --gold: #c9922a;
      --gold-light: #e8a020;
      --gold-pale: #f5d48e;
      --cream: #faf7f2;
      --white: #ffffff;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
    }

    /* ── CANVAS BACKGROUND ── */
    #bg-canvas {
      position: fixed; inset: 0;
      z-index: 0;
    }

    /* ── NOISE OVERLAY ── */
    .noise {
      position: fixed; inset: 0; z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
    }

    /* ── DIAGONAL GOLD STRIPE ── */
    .stripe {
      position: fixed;
      top: -20%; left: -10%;
      width: 55%; height: 200%;
      background: linear-gradient(135deg, rgba(201,146,42,0.07) 0%, rgba(201,146,42,0.02) 60%, transparent 100%);
      transform: rotate(-8deg);
      z-index: 1;
      pointer-events: none;
    }

    /* ── MAIN WRAPPER ── */
    .wrapper {
      position: relative; z-index: 2;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── CENTER CARD ── */
    .card {
      text-align: center;
      padding: 0 2rem;
      max-width: 820px;
    }

    /* ── EMBLEM ── */
    .emblem {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(201,146,42,0.5);
      background: radial-gradient(circle at 40% 40%, rgba(201,146,42,0.18), rgba(15,35,70,0.6));
      backdrop-filter: blur(8px);
      margin-bottom: 2.4rem;
      position: relative;
      opacity: 0;
      transform: scale(0.6) rotate(-20deg);
      animation: emblem-in 1s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;
      box-shadow: 0 0 60px rgba(201,146,42,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .emblem::before {
      content: '';
      position: absolute; inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(201,146,42,0.25);
    }
    .emblem span {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--gold-light);
      letter-spacing: -0.02em;
      text-shadow: 0 2px 20px rgba(201,146,42,0.4);
    }
    @keyframes emblem-in {
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* ── TAGLINE ABOVE ── */
    .tagline-top {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      transform: translateY(12px);
      animation: fade-up 0.8s ease 0.9s forwards;
      margin-bottom: 1.2rem;
    }

    /* ── HEADLINE ── */
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 4.5vw, 5.2rem);
      font-weight: 750;
      color: var(--white);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      overflow: hidden;
    }
    .headline .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(80px) rotate(3deg);
      animation: word-rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .headline .word:nth-child(1) { animation-delay: 1.1s; }
    .headline .word:nth-child(2) { animation-delay: 1.22s; margin-left: 0.22em; }
    .headline .italic-word {
      display: inline-block;
      font-style: italic;
      color: var(--gold-light);
      opacity: 0;
      transform: translateY(80px) rotate(3deg);
      animation: word-rise 0.7s cubic-bezier(0.16,1,0.3,1) 1.35s forwards;
      margin-left: 0.22em;
    }

    @keyframes word-rise {
      to { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center;
      justify-content: center; gap: 1rem;
      margin: 2rem auto;
      opacity: 0;
      animation: fade-up 0.8s ease 1.7s forwards;
    }
    .divider-line {
      width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,146,42,0.6));
    }
    .divider-line.right {
      background: linear-gradient(to left, transparent, rgba(201,146,42,0.6));
    }
    .divider-diamond {
      width: 6px; height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(201,146,42,0.5);
    }

    /* ── FULL NAME ── */
    .full-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.08em;
      line-height: 1.9;
      opacity: 0;
      animation: fade-up 0.8s ease 1.9s forwards;
      margin-bottom: 2.6rem;
    }

    /* ── STATS ROW ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin-bottom: 50px;
      opacity: 0;
      animation: fade-up 0.8s ease 2.1s forwards;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1;
      display: block;
    }
    .stat-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 0.3rem;
      display: block;
    }
    .stat-sep {
      width: 1px;
      height: 40px;
      background: rgba(201,146,42,0.25);
      align-self: center;
    }

    /* ── ENTER BUTTON ── */
    .enter-btn {
      display: inline-flex;
      align-items: center; gap: 0.9rem;
      padding: 1rem 2.6rem;
      border: 1.5px solid rgba(201,146,42,0.5);
      border-radius: 3px;
      background: transparent;
      color: var(--gold-light);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fade-up 0.8s ease 2.4s forwards;
      transition: color 0.4s, border-color 0.4s;
      
    }
    .enter-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      transform: translateX(-101%);
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      z-index: 0;
    }
    .enter-btn:hover::before { transform: translateX(0); }
    .enter-btn:hover { color: var(--navy); border-color: transparent; }
    .enter-btn span, .enter-btn svg { position: relative; z-index: 1; }
    .enter-btn svg {
      width: 16px; height: 16px;
      transition: transform 0.3s ease;
    }
    .enter-btn:hover svg { transform: translateX(4px); }

    /* ── YEAR BADGE ── */
    .year-badge {
      position: fixed;
      bottom: 4.8rem; left: 33%; transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
      opacity: 0;
      animation: fade-up 0.8s ease 2.8s forwards;
    }

    /* ── CORNER DECOR ── */
    .corner {
      position: fixed;
      width: 80px; height: 80px;
      opacity: 0;
      animation: corner-in 1s ease 2.5s forwards;
    }
    .corner.tl { top: 2rem; left: 2rem; border-top: 1px solid rgba(201,146,42,0.3); border-left: 1px solid rgba(201,146,42,0.3); }
    .corner.tr { top: 2rem; right: 2rem; border-top: 1px solid rgba(201,146,42,0.3); border-right: 1px solid rgba(201,146,42,0.3); }
    .corner.bl { bottom: 2rem; left: 2rem; border-bottom: 1px solid rgba(201,146,42,0.3); border-left: 1px solid rgba(201,146,42,0.3); }
    .corner.br { bottom: 2rem; right: 2rem; border-bottom: 1px solid rgba(201,146,42,0.3); border-right: 1px solid rgba(201,146,42,0.3); }
    @keyframes corner-in { to { opacity: 1; } }

    /* ── SHARED ANIMATIONS ── */
    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── TRANSITION OUT ── */
    .page-exit {
      animation: page-out 0.6s cubic-bezier(0.4,0,1,1) forwards !important;
    }
    @keyframes page-out {
      to { opacity: 0; transform: scale(1.04); }
    }
    body.page-exit { overflow: hidden; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="noise"></div>
  <div class="stripe"></div>

  <!-- Corner decorations -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="wrapper">
    <div class="card">

      <!-- Emblem -->
      <div class="emblem"><span>IS</span></div>

      <!-- Top tagline -->
      <p class="tagline-top">Excellence · Intégrité · Innovation</p>

      <!-- Headline -->
      <h1 class="headline">
        <span class="word">Bienvenue</span>
        <span class="word">à</span>
        <span class="italic-word">ISCAM</span>
      </h1>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-diamond"></div>
        <div class="divider-line right"></div>
      </div>

      <!-- Full name -->
      <p class="full-name">
        Institut Supérieur de Comptabilité<br>et d'Administration de Management
      </p>

      <!-- Stats -->
      <div class="stats">
        <div class="stat-item">
          <span class="stat-num" data-target="1248">0</span>
          <span class="stat-label">Étudiants</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-num" data-target="64">0</span>
          <span class="stat-label">Enseignants</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-num" data-target="6">0</span>
          <span class="stat-label">Départements</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-num" data-target="87">0</span>
          <span class="stat-label">Cours</span>
        </div>
      </div>

      <!-- Enter button -->
      <a class="enter-btn" id="enterBtn" href="login.html">
        <span>Accéder au Système</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Year -->
  <p class="year-badge">ISCAM — Système de Gestion Universitaire &nbsp;·&nbsp; 2025–2026</p>

  <script>
    // ── CANVAS PARTICLE FIELD ──
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], lines = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); initParticles(); });

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * W;
        this.y = initial ? Math.random() * H : H + 10;
        this.r = Math.random() * 1.4 + 0.3;
        this.speed = Math.random() * 0.25 + 0.08;
        this.opacity = Math.random() * 0.5 + 0.1;
        this.drift = (Math.random() - 0.5) * 0.3;
      }
      update() {
        this.y -= this.speed;
        this.x += this.drift;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(201,146,42,${this.opacity})`;
        ctx.fill();
      }
    }

    function initParticles() {
      particles = Array.from({ length: 90 }, () => new Particle());
    }
    initParticles();

    // Gradient background
    function drawBg() {
      const grad = ctx.createRadialGradient(W * 0.35, H * 0.4, 0, W * 0.5, H * 0.5, W * 0.9);
      grad.addColorStop(0, '#1a3a6b');
      grad.addColorStop(0.5, '#0f2346');
      grad.addColorStop(1, '#070f1f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Subtle gold glow top-right
      const glow = ctx.createRadialGradient(W * 0.85, H * 0.1, 0, W * 0.85, H * 0.1, W * 0.4);
      glow.addColorStop(0, 'rgba(201,146,42,0.06)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      // Subtle gold glow bottom-left
      const glow2 = ctx.createRadialGradient(W * 0.1, H * 0.9, 0, W * 0.1, H * 0.9, W * 0.35);
      glow2.addColorStop(0, 'rgba(36,81,143,0.15)');
      glow2.addColorStop(1, 'transparent');
      ctx.fillStyle = glow2;
      ctx.fillRect(0, 0, W, H);
    }

    function animate() {
      drawBg();
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // ── COUNTER ANIMATION ──
    function animateCounters() {
      document.querySelectorAll('.stat-num[data-target]').forEach(el => {
        const target = parseInt(el.dataset.target);
        const duration = 1800;
        const start = performance.now();
        function tick(now) {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          el.textContent = Math.floor(ease * target);
          if (progress < 1) requestAnimationFrame(tick);
          else el.textContent = target;
        }
        requestAnimationFrame(tick);
      });
    }
    setTimeout(animateCounters, 2200);

    // ── PAGE TRANSITION ──
    document.getElementById('enterBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const dest = this.getAttribute('href');
      document.body.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
      document.body.style.opacity = '0';
      document.body.style.transform = 'scale(1.04)';
      setTimeout(() => { window.location.href = dest; }, 600);
    });
  </script>
</body>
</html>
